name: Deploy DATAClaw to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── 1. Test Backend ────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_dataclaw
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_dataclaw
          CLERK_PEM_PUBLIC_KEY: ""
          CLERK_PERMITTED_ORIGINS: http://localhost:5173
          FRONTEND_URL: http://localhost:5173
          GEMINI_API_KEY: ""
          LLM_FALLBACK_ENABLED: "false"
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # ── 2. Build & Push Docker Image ───────────────────────────────────────────
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-backend

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dataclaw-backend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/dataclaw-backend:latest
          cache-to: type=inline

  # ── 3. Build Frontend ──────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vite bundle
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          cd frontend
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 4. Deploy to EC2 ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-push, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync frontend dist to EC2
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/dataclaw/frontend/dist/

      - name: Sync migrations to EC2
        run: |
          rsync -az \
            --exclude='__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/migrations/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/dataclaw/migrations/

      - name: Pull new image & run DB migrations on EC2
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << 'ENDSSH'
            set -e

            # Pull the latest backend image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dataclaw-backend:latest

            # Run flask db upgrade inside a temporary container
            docker run --rm \
              -v /var/www/dataclaw/backend/.env:/app/.env:ro \
              --network host \
              ${{ secrets.DOCKERHUB_USERNAME }}/dataclaw-backend:latest \
              flask db upgrade
          ENDSSH

      - name: Restart backend container
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << 'ENDSSH'
            set -e

            # Stop and remove old container if running
            docker stop dataclaw-backend 2>/dev/null || true
            docker rm dataclaw-backend 2>/dev/null || true

            # Start fresh container
            docker run -d \
              --name dataclaw-backend \
              --restart unless-stopped \
              -v /var/www/dataclaw/backend/.env:/app/.env:ro \
              --network host \
              ${{ secrets.DOCKERHUB_USERNAME }}/dataclaw-backend:latest

            # Remove dangling images to save disk space
            docker image prune -f
          ENDSSH

      - name: Reload Nginx
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo nginx -t && sudo systemctl reload nginx"

      - name: Health check
        run: |
          sleep 8
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ secrets.DOMAIN }}/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED -- status $STATUS"
            exit 1
          fi
          echo "Health check PASSED -- status $STATUS"
